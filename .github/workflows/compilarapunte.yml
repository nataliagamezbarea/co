name: Compilar Apuntes LaTeX

on:
  workflow_dispatch:
    inputs:
      grado:
        description: 'Nombre del grado o rama'
        required: false
        default: ''
      archivo:
        description: 'Nombre del archivo original'
        required: false
        default: ''
      nombre_apunte:
        description: 'Nombre del apunte compilado'
        required: false
        default: ''
      repo_general:
        description: 'Repositorio general (owner/repo)'
        required: false
        default: ''
      gh_token:
        description: 'Token de acceso al repositorio privado'
        required: false
        default: ''
      accion:
        description: 'Accion a ejecutar (compile_apunte / compile_all_apuntes)'
        required: false
        default: 'compile_apunte'
      payload:
        description: 'Payload JSON adicional'
        required: false
        default: '{}'

permissions:
  contents: write
  actions: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio privado con el codigo fuente
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.repo_general }}
          token: ${{ github.event.inputs.gh_token || secrets.GH_TOKEN_GENERAL || secrets.GITHUB_TOKEN }}
          ref: master
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias Python
        run: |
          pip install pymupdf pillow requests --quiet

      - name: Instalar xelatex y paquetes LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-latex-extra \
            texlive-lang-spanish \
            fonts-open-sans \
            fontconfig 2>&1 | tail -5
          fc-cache -f

      - name: Compilar apunte con xelatex
        env:
          GH_TOKEN_GENERAL: ${{ github.event.inputs.gh_token || secrets.GH_TOKEN_GENERAL || secrets.GITHUB_TOKEN }}
          GH_REPO_GENERAL: ${{ github.event.inputs.repo_general }}
          INPUT_ACCION: ${{ github.event.inputs.accion || 'compile_apunte' }}
          INPUT_GRADO: ${{ github.event.inputs.grado }}
          INPUT_ARCHIVO: ${{ github.event.inputs.archivo }}
          INPUT_NOMBRE_APUNTE: ${{ github.event.inputs.nombre_apunte }}
          INPUT_GH_TOKEN: ${{ github.event.inputs.gh_token || secrets.GH_TOKEN_GENERAL || secrets.GITHUB_TOKEN }}
          INPUT_PAYLOAD: ${{ github.event.inputs.payload || '{}' }}
        run: |
          python3 - << 'EOF'
          import base64
          import json
          import os
          import sys
          import subprocess
          import shutil
          import tempfile
          import urllib.error
          import urllib.request
          from pathlib import Path

          TOKEN     = os.environ.get("INPUT_GH_TOKEN") or os.environ.get("GH_TOKEN_GENERAL") or ""
          REPO      = os.environ.get("GH_REPO_GENERAL") or ""
          GRADO     = os.environ.get("INPUT_GRADO") or ""
          ARCHIVO   = os.environ.get("INPUT_ARCHIVO") or ""
          NOMBRE    = os.environ.get("INPUT_NOMBRE_APUNTE") or ""
          ACCION    = os.environ.get("INPUT_ACCION") or "compile_apunte"
          WORKSPACE = os.getcwd()  # Es el checkout de GRADOS_INFORMATICOS

          def gh_api(path, method="GET", data=None, token=None, repo=None):
              tok = token or TOKEN
              rep = repo or REPO
              url = f"https://api.github.com/repos/{rep}/{path}"
              headers = {"Accept": "application/vnd.github.v3+json", "User-Agent": "LaTeX-Worker"}
              if tok:
                  headers["Authorization"] = f"Bearer {tok}"
              body = None
              if data is not None:
                  body = json.dumps(data).encode()
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=body, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as r:
                      raw = r.read()
                      if r.status == 204:
                          return {"ok": True}
                      return json.loads(raw)
              except urllib.error.HTTPError as e:
                  return {"ok": False, "status": e.code, "error": e.read().decode(errors="ignore")}
              except Exception as e:
                  return {"ok": False, "error": str(e)}

          def find_file(branch, filename):
              tree = gh_api(f"git/trees/{branch}?recursive=1")
              base = Path(filename).name.lower()
              if "tree" in tree:
                  for item in tree["tree"]:
                      p = item.get("path", "")
                      if p.lower() == filename.lower() or p.lower().endswith("/" + filename.lower()):
                          return p
                  for item in tree["tree"]:
                      p = item.get("path", "")
                      if Path(p).name.lower() == base:
                          return p
              return filename

          def download_file(branch, path):
              res = gh_api(f"contents/{path}?ref={branch}")
              if "content" in res:
                  return base64.b64decode(res["content"])
              if res.get("download_url"):
                  try:
                      req = urllib.request.Request(
                          res["download_url"],
                          headers={"Authorization": f"Bearer {TOKEN}"} if TOKEN else {}
                      )
                      with urllib.request.urlopen(req) as r:
                          return r.read()
                  except Exception:
                      pass
              return None

          def upload_file(branch, path, content_bytes, sha=None):
              data = {
                  "message": f"Compilar apunte LaTeX: {Path(path).name}",
                  "content": base64.b64encode(content_bytes).decode(),
                  "branch": branch
              }
              if sha:
                  data["sha"] = sha
              else:
                  check = gh_api(f"contents/{path}?ref={branch}")
                  if "sha" in check:
                      data["sha"] = check["sha"]
              return gh_api(f"contents/{path}", method="PUT", data=data)

          def generar_tex_simple(nombre, grado, texto_contenido=""):
              """Genera un .tex mínimo si no se puede usar el backend completo."""
              titulo = nombre.replace("APUNTE_", "").replace("_", " ").strip()
              contenido = texto_contenido or f"Apunte generado automáticamente para {nombre}."
              lineas = "\n".join(f"\\item {l.strip()}" for l in contenido.splitlines() if l.strip())
              return rf"""
          \documentclass[12pt,a4paper]{{article}}
          \usepackage[utf8]{{inputenc}}
          \usepackage[T1]{{fontenc}}
          \usepackage[spanish]{{babel}}
          \usepackage{{geometry}}
          \geometry{{margin=2.5cm}}
          \usepackage{{parskip}}
          \usepackage{{titlesec}}
          \usepackage{{xcolor}}
          \definecolor{{acento}}{{HTML}}{{2563EB}}
          \titleformat{{\section}}{{\color{{acento}}\large\bfseries}}{{}}{{0em}}{{}}
          \begin{{document}}
          \begin{{center}}
          {{\LARGE\bfseries\color{{acento}} {titulo}}}\\[0.5em]
          {{\large {grado.replace("_", " ")}}}
          \end{{center}}
          \vspace{{1em}}
          \begin{{itemize}}
          {lineas if lineas else r"\item Contenido pendiente."}
          \end{{itemize}}
          \end{{document}}
          """

          # ─── FLUJO PRINCIPAL ──────────────────────────────────────────────────────
          nombre_limpio = NOMBRE or Path(ARCHIVO).stem
          dest_path     = f"apuntes/{nombre_limpio}.pdf"

          # 1. Intentar usar el backend completo que está en el workspace (GRADOS_INFORMATICOS)
          pdf_bytes = None
          error_msg = ""

          sys.path.insert(0, WORKSPACE)
          try:
              from backend.generador_apuntes.compilacion.compilar_apunte_pdf import compilar_apunte_pdf
              ruta_pdf = compilar_apunte_pdf(GRADO, nombre_limpio, ARCHIVO)
              if ruta_pdf and Path(ruta_pdf).exists():
                  pdf_bytes = Path(ruta_pdf).read_bytes()
                  print(f"[OK] Compilado con backend completo: {ruta_pdf}")
              else:
                  error_msg = "backend: compilar_apunte_pdf no devolvio PDF"
          except Exception as e:
              error_msg = str(e)
              print(f"[WARN] Backend completo no disponible: {e}")

          # 2. Fallback: compilar un .tex básico con xelatex
          if not pdf_bytes:
              print("[INFO] Usando compilacion xelatex básica de fallback...")
              texto = ""
              pdf_orig = download_file(GRADO, find_file(GRADO, ARCHIVO))
              if pdf_orig:
                  try:
                      import pymupdf
                      doc = pymupdf.open(stream=pdf_orig, filetype="pdf")
                      texto = "\n".join(p.get_text("text") for p in doc)
                      doc.close()
                  except Exception:
                      pass

              tex_src = generar_tex_simple(nombre_limpio, GRADO, texto[:3000])
              with tempfile.TemporaryDirectory() as tmpdir:
                  tex_path = Path(tmpdir) / f"{nombre_limpio}.tex"
                  tex_path.write_text(tex_src, encoding="utf-8")
                  result = subprocess.run(
                      ["xelatex", "-interaction=nonstopmode", str(tex_path)],
                      capture_output=True, cwd=tmpdir, timeout=120
                  )
                  pdf_path = Path(tmpdir) / f"{nombre_limpio}.pdf"
                  if pdf_path.exists():
                      pdf_bytes = pdf_path.read_bytes()
                      print("[OK] PDF compilado con xelatex fallback")
                  else:
                      log = result.stdout.decode(errors="ignore")[-2000:]
                      print(f"[ERROR] xelatex fallo:\n{log}")
                      error_msg = f"xelatex fallo: {log[-500:]}"

          if not pdf_bytes:
              result = {
                  "ok": False, "total": 1, "compilados": 0,
                  "exitosos": [],
                  "fallidos": [{"nombre": nombre_limpio, "grado": GRADO, "archivo": ARCHIVO, "error": error_msg}]
              }
              print(json.dumps(result, ensure_ascii=False))
              sys.exit(1)

          # 3. Subir PDF compilado
          put_res = upload_file(GRADO, dest_path, pdf_bytes)
          if "content" not in put_res and put_res.get("status") not in (200, 201):
              result = {
                  "ok": False, "total": 1, "compilados": 0,
                  "exitosos": [],
                  "fallidos": [{"nombre": nombre_limpio, "grado": GRADO, "archivo": ARCHIVO, "error": f"Error subiendo PDF: {put_res}"}]
              }
              print(json.dumps(result, ensure_ascii=False))
              sys.exit(1)

          # 4. Actualizar revision.json
          try:
              rev_res = gh_api("contents/almacen/datos/revision.json?ref=master")
              rev = {}
              rev_sha = None
              if "content" in rev_res:
                  rev_sha = rev_res.get("sha")
                  rev = json.loads(base64.b64decode(rev_res["content"]))
              k = f"{GRADO}::{ARCHIVO}"
              rev[k] = rev.get(k, {})
              rev[k]["inc_apunte"] = True
              rev[k]["nombre_apunte"] = nombre_limpio
              rev[k]["latex_compilado"] = True
              rev_data = {
                  "message": f"revision.json: compilado {nombre_limpio}",
                  "content": base64.b64encode(json.dumps(rev, indent=2, ensure_ascii=False).encode()).decode(),
                  "branch": "master"
              }
              if rev_sha:
                  rev_data["sha"] = rev_sha
              gh_api("contents/almacen/datos/revision.json", method="PUT", data=rev_data)
          except Exception as e:
              print(f"[WARN] revision.json: {e}")

          result = {
              "ok": True, "total": 1, "compilados": 1,
              "exitosos": [{"nombre": nombre_limpio, "grado": GRADO, "archivo": ARCHIVO, "ruta": dest_path}],
              "fallidos": []
          }
          print(json.dumps(result, ensure_ascii=False))
          EOF
